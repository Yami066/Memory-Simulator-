<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Virtual Memory Simulator — Windows 11</title>
<meta name="description" content="Interactive Windows 11 themed virtual memory page replacement simulator with FIFO, LRU, MRU, and Optimal algorithms."/>
<link rel="stylesheet" href="style.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
</head>
<body>

<!-- ═══════ DESKTOP ═══════ -->

<!-- DESKTOP AREA (mini app windows appear here) -->
<div id="desktop-area"></div>

<!-- APP WINDOW -->
<div id="app-window">

  <!-- Title Bar -->
  <div id="title-bar">
    <div id="title-bar-left">
      <svg id="title-bar-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
        <rect x="1" y="1" width="6" height="6" rx="1" fill="#0078D4"/>
        <rect x="9" y="1" width="6" height="6" rx="1" fill="#00B4D8"/>
        <rect x="1" y="9" width="6" height="6" rx="1" fill="#00B4D8"/>
        <rect x="9" y="9" width="6" height="6" rx="1" fill="#0078D4"/>
      </svg>
      <span id="title-bar-text">Virtual Memory Manager</span>
    </div>
    <div id="title-bar-controls">
      <button class="win-ctrl" id="win-minimize" title="Minimize">─</button>
      <button class="win-ctrl" id="win-maximize" title="Maximize">□</button>
      <button class="win-ctrl win-close" id="win-close" title="Close">✕</button>
    </div>
  </div>

  <!-- Window Body -->
  <div id="window-body">

    <!-- STATS HUD -->
    <div id="stats-hud">
      <div class="stat-pill"><span class="stat-label">Accesses</span><span class="stat-value" id="stat-accesses">0</span></div>
      <div class="stat-pill"><span class="stat-label">Faults</span><span class="stat-value" id="stat-faults">0</span></div>
      <div class="stat-pill"><span class="stat-label">Hits</span><span class="stat-value" id="stat-hits">0</span></div>
      <div class="stat-pill"><span class="stat-label">Fault Rate</span><span class="stat-value" id="stat-rate">0%</span></div>
      <div class="stat-pill"><span class="stat-label">Algorithm</span><span class="stat-value" id="stat-algo">FIFO</span></div>
      <div class="stat-pill"><span class="stat-label">Step</span><span class="stat-value" id="stat-step">0/0</span></div>
    </div>

    <!-- MAIN AREA -->
    <div id="main-area">
      <!-- Queue -->
      <div id="queue-section">
        <span id="queue-label">Activity Queue</span>
        <div id="queue-chips"></div>
      </div>

      <!-- RAM -->
      <div id="ram-section">
        <div id="ram-title">Active RAM</div>
        <div id="ram-slots"></div>
      </div>

      <!-- Controls -->
      <div id="controls-row">
        <label style="font-size:11px;color:#8b95a5">Frames</label>
        <input type="number" id="inp-frames" value="3" min="1" max="6"/>
        <select id="sel-algo"><option value="FIFO">FIFO</option><option value="LRU">LRU</option><option value="MRU">MRU</option><option value="OPT">Optimal</option></select>
        <select id="sel-speed"><option value="1500">Slow</option><option value="900" selected>Normal</option><option value="400">Fast</option></select>
        <button class="cbtn" id="btn-run">▶ RUN</button>
        <button class="cbtn" id="btn-step">⏭ STEP</button>
        <button class="cbtn" id="btn-reset">⟲ RESET</button>
        <button class="cbtn" id="btn-random">🎲 RANDOM</button>
        <button class="cbtn" id="btn-compare">📊 COMPARE</button>
        <button class="cbtn" id="btn-belady">⚠ BELADY'S</button>
      </div>
    </div>

    <!-- SIDE PANELS -->
    <div id="side-panels">
      <div class="panel" id="panel-page-table">
        <div class="panel-header" onclick="togglePanel('panel-page-table')">
          <span class="panel-title">Page Table</span>
          <button class="panel-toggle">−</button>
        </div>
        <div class="panel-body">
          <table id="page-table"><thead><tr><th>App</th><th>Frame</th><th>Valid</th></tr></thead><tbody id="page-table-body"></tbody></table>
        </div>
      </div>
      <div class="panel" id="panel-event-log">
        <div class="panel-header" onclick="togglePanel('panel-event-log')">
          <span class="panel-title">Event Log</span>
          <button class="panel-toggle">−</button>
        </div>
        <div class="panel-body">
          <div id="event-log-wrapper">
            <div id="event-log-titlebar">
              <span>C:\Windows\System32\vmm.exe</span>
              <span id="event-log-dots">─ □ ✕</span>
            </div>
            <div id="event-log"></div>
          </div>
        </div>
      </div>
    </div>

  </div><!-- /window-body -->
</div><!-- /app-window -->

<!-- TASKBAR -->
<div id="taskbar">
  <div id="taskbar-inner">
    <!-- Start Button -->
    <button class="taskbar-start" id="start-btn" title="Start">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
        <rect x="1" y="1" width="8" height="8" rx="1.5" fill="#fff"/>
        <rect x="11" y="1" width="8" height="8" rx="1.5" fill="#fff"/>
        <rect x="1" y="11" width="8" height="8" rx="1.5" fill="#fff"/>
        <rect x="11" y="11" width="8" height="8" rx="1.5" fill="#fff"/>
      </svg>
    </button>
    <div id="taskbar-separator"></div>
    <!-- App Icons injected here by JS -->
  </div>
  <!-- System Tray -->
  <div id="system-tray">
    <span class="tray-item" title="Wi-Fi">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#b0b8c4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
    </span>
    <span class="tray-item" title="Battery">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#b0b8c4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="6" width="18" height="12" rx="2" ry="2"/><line x1="23" y1="13" x2="23" y2="11"/><rect x="3" y="8" width="10" height="8" rx="1" fill="#4ade80" stroke="none"/></svg>
    </span>
    <span class="tray-clock" id="tray-clock"></span>
  </div>
</div>

<!-- CHART OVERLAY -->
<div id="bottom-panel"><button id="close-chart">✕</button><h3>Algorithm Comparison</h3><div id="chart-container"><canvas id="compare-chart"></canvas></div></div>

<!-- BELADY BANNER -->
<div id="belady-banner"></div>

<script src="app.js"></script>
<script>
/* === Taskbar clock (purely cosmetic) === */
(function tickClock(){
  const el=document.getElementById('tray-clock');
  if(!el) return;
  const now=new Date();
  el.textContent=now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  setTimeout(tickClock,10000);
})();
</script>
</body>
</html>
